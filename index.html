<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yomi RSS Reader</title>
    <script>
      (() => {
        const root = document.documentElement;
        let themeMode = "auto";

        try {
          const settingsJson = localStorage.getItem("user-settings");
          if (settingsJson) {
            const settings = JSON.parse(settingsJson);
            if (settings && typeof settings.theme === "string") {
              themeMode = settings.theme;
            }
          }
        } catch (error) {
          console.error("Error reading startup theme settings:", error);
        }

        const systemPrefersDark =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches;
        const resolvedTheme =
          themeMode === "dark" ? "dark" : themeMode === "light" ? "light" : systemPrefersDark ? "dark" : "light";

        root.setAttribute("data-theme", resolvedTheme);
        root.style.colorScheme = resolvedTheme;

        // Platform chrome: macOS uses native sidebar vibrancy; Windows/Linux need CSS glass.
        const ua = navigator.userAgent.toLowerCase();
        const platform = navigator.platform ? navigator.platform.toLowerCase() : "";
        const os =
          ua.includes("mac") || platform.includes("mac")
            ? "macos"
            : ua.includes("win") || platform.includes("win")
              ? "windows"
              : ua.includes("linux") || platform.includes("linux")
                ? "linux"
                : "other";
        root.setAttribute("data-os", os);

        // Surface style variant (renderer-only store): modern glass vs classic solid.
        let uiThemeVariant = "modern";
        try {
          const uiSettingsJson = localStorage.getItem("user-settings-ui");
          if (uiSettingsJson) {
            const uiSettings = JSON.parse(uiSettingsJson);
            if (uiSettings && (uiSettings.uiThemeVariant === "classic" || uiSettings.uiThemeVariant === "modern")) {
              uiThemeVariant = uiSettings.uiThemeVariant;
            }
            const fill = uiSettings && uiSettings.surfaceFillOpacity;
            if (typeof fill === "number" && Number.isFinite(fill)) {
              const clamped = Math.min(0.96, Math.max(0.4, fill));
              const reader = Math.min(0.96, clamped + (os === "macos" ? 0.37 : 0.08));
              root.style.setProperty("--app-surface-fill-alpha", String(clamped));
              root.style.setProperty("--app-reader-fill-alpha", String(reader));
            }
          }
        } catch (error) {
          console.error("Error reading startup UI theme variant:", error);
        }
        root.setAttribute("data-ui-theme", uiThemeVariant);

        // Reader theme before first paint (main and article windows only), so a
        // themed user never sees the built-in palette flash first. Ids must match
        // READER_THEMES in src/services/settings/readerThemes.ts (checked by
        // test/styles/readerThemesContrast.test.ts); ThemeProvider re-applies it.
        const READER_THEME_IDS = ["paper", "sepia", "calm", "eye-care", "washi", "parchment", "newsprint", "e-ink", "solarized", "quiet", "midnight", "oled-night", "high-contrast"];
        try {
          const windowType = new URLSearchParams(window.location.search).get("window");
          const uiSettingsJson = windowType === "settings" || windowType === "update"
            ? null
            : localStorage.getItem("user-settings-ui");
          const uiSettings = uiSettingsJson ? JSON.parse(uiSettingsJson) : null;
          let readerTheme = uiSettings && uiSettings.readerTheme;
          const legacy = uiSettings && uiSettings.readerThemes;
          if (typeof readerTheme !== "string" && legacy && typeof legacy === "object") {
            readerTheme = [legacy.light, legacy.dark].find((id) => READER_THEME_IDS.includes(id));
          }
          if (READER_THEME_IDS.includes(readerTheme)) {
            root.setAttribute("data-reader-theme", readerTheme);
            root.setAttribute("data-reader-scheme", resolvedTheme);
          }
        } catch (error) {
          console.error("Error reading startup reader theme:", error);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
